# PENTAGON — reverse proxy nginx (termine le TLS, proxifie vers gunicorn).
#
# Rôle : exposer la console UNIQUEMENT en HTTPS. gunicorn écoute en clair sur
# 127.0.0.1:5000 (jamais joignable de l'extérieur) ; nginx termine le TLS et
# transmet les en-têtes X-Forwarded-* dont Flask (ProxyFix) a besoin.
#
# Installation :
#   sudo cp deploy/nginx-pentagon.conf /etc/nginx/sites-available/pentagon
#   sudo ln -s /etc/nginx/sites-available/pentagon /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default      # évite un vhost par défaut
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificat Let's Encrypt (ajoute automatiquement le bloc « listen 443 ssl »
# et la redirection 80 -> 443) :
#   sudo certbot --nginx -d pentagon.rokina-sylla.me
#
# Remplacez partout pentagon.rokina-sylla.me par VOTRE sous-domaine pointant
# (enregistrement DNS A) sur l'IP publique de la VM.

server {
    listen 80;
    listen [::]:80;
    server_name pentagon.rokina-sylla.me;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Indispensable : Flask (ProxyFix) rétablit le schéma réel (https) et
        # l'IP cliente à partir de ces en-têtes. Sans X-Forwarded-Proto, le
        # cookie Secure et HSTS ne s'activeraient pas.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Flux SSE de progression (/api/stream/...) : pas de bufferisation et
        # connexion longue, sinon la progression en direct se fige.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
