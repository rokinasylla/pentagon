<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PENTAGON — Connexion opérateur</title>
  <style>
    :root{
      --bg:#0a0e14; --panel:#121823; --panel2:#0f141d; --line:#1f2a3a;
      --ink:#e6edf6; --muted:#8aa0b8; --accent:#3ddc97; --accent2:#4aa3ff;
      --danger:#f87171;
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; background:
        radial-gradient(1200px 600px at 20% -10%, #0e2436 0, transparent 60%),
        radial-gradient(900px 500px at 100% 110%, #10201a 0, transparent 55%),
        var(--bg);
      color:var(--ink); font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif;
      display:flex; align-items:center; justify-content:center; padding:24px;
    }
    .card{
      width:100%; max-width:380px; background:linear-gradient(180deg,var(--panel),var(--panel2));
      border:1px solid var(--line); border-radius:16px; padding:28px 26px;
      box-shadow:0 20px 60px rgba(0,0,0,.45);
    }
    .brand{display:flex; align-items:center; gap:10px; margin-bottom:4px}
    .logo{
      width:34px; height:34px; border-radius:9px; flex:0 0 auto;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      display:grid; place-items:center; color:#06221a; font-weight:800;
    }
    h1{font-size:18px; margin:0; letter-spacing:.5px}
    .sub{color:var(--muted); font-size:12.5px; margin:2px 0 22px}
    label{display:block; font-size:12.5px; color:var(--muted); margin:14px 0 6px}
    input{
      width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--line);
      background:#0b111a; color:var(--ink); font-size:14px; outline:none;
    }
    input:focus{border-color:var(--accent2); box-shadow:0 0 0 3px rgba(74,163,255,.15)}
    button{
      width:100%; margin-top:20px; padding:12px; border:0; border-radius:10px;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      color:#06221a; font-weight:700; font-size:14.5px; cursor:pointer;
    }
    button:hover{filter:brightness(1.07)}
    .err{
      margin-top:16px; padding:10px 12px; border-radius:10px; font-size:13px;
      background:rgba(248,113,113,.12); border:1px solid rgba(248,113,113,.4);
      color:var(--danger);
    }
    .foot{margin-top:18px; color:var(--muted); font-size:11.5px; text-align:center}
  </style>
</head>
<body>
  <form class="card" method="post" action="{{ url_for('login') }}">
    <div class="brand">
      <div class="logo">P</div>
      <h1>PENTAGON</h1>
    </div>
    <div class="sub">Console opérateur — accès restreint</div>

    <label for="username">Opérateur</label>
    <input id="username" name="username" autocomplete="username" autofocus required>

    <label for="password">Mot de passe</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>

    <button type="submit">Se connecter</button>

    {% if error %}<div class="err">{{ error }}</div>{% endif %}

    <div class="foot">Interface offensive — usage autorisé uniquement</div>
  </form>
</body>
</html>
